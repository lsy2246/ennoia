id = "workflow"
version = "0.1.0"
name = "Workflow"
description = "提供 run、task、artifact 与调度动作的编排实现；是否接入 conversation 或 memory 由系统动作管道与事件链决定。"
docs = "docs/overview.md"

[compat]
ennoia = ">=0.1.0"

[conversation]
visible = true
resources = ["workflow.run", "workflow.task", "workflow.artifact"]
operations = [
  "run.create",
  "run.get",
  "run.list",
  "task.list",
  "artifact.list",
]

[[views]]
name = "workflow.page"
type = "page"
title = { key = "ext.workflow.page", fallback = "工作编排" }
nav = "sidebar"
order = 35
icon = "workflow"
route = "/workflow"

[[operations]]
name = "workflow.default"
description = "默认 workflow 行为实现。"

[[operations]]
name = "workflow.workspace"
title = { key = "ext.workflow.workspace", fallback = "工作流总览" }
description = "读取 workflow 工作台摘要。"

[[operations]]
name = "run.create"
description = "创建 workflow run。"
agent = true

[[operations]]
name = "run.get"
description = "读取 workflow run 详情。"
agent = true

[[operations]]
name = "run.list"
description = "按会话列出 workflow run。"
agent = true

[[operations]]
name = "task.list"
description = "列出 run 的任务。"
agent = true

[[operations]]
name = "artifact.list"
description = "列出 run 的产物。"
agent = true

[[operations]]
name = "workflow.run"
title = { key = "ext.workflow.schedule.run", fallback = "Run workflow" }
description = "由 scheduler 触发 workflow run。"
agent = true
schedule = true

[[operations]]
name = "workflow.conversation.message.created"
description = "处理会话消息创建事件。"

[[operations]]
name = "workflow.operation.updated"
description = "处理系统操作状态更新事件。"

[[operations]]
name = "workflow.permission.approval.resolved"
description = "处理权限审批结果事件。"

[[operations]]
name = "workflow.run.requested"
description = "处理 run 请求事件。"

[[operations]]
name = "workflow.run.stage.changed"
description = "处理 run 阶段变化事件。"

[[operations]]
name = "workflow.artifact.created"
description = "处理 workflow artifact 创建事件。"

[[operations]]
name = "workflow.job.due"
description = "处理调度任务到期事件。"

[[events]]
on = "conversation.message.created"
operation = "workflow.conversation.message.created"
priority = 100

[[events]]
on = "operation.updated"
operation = "workflow.operation.updated"
priority = 100

[[events]]
on = "permission.approval.resolved"
operation = "workflow.permission.approval.resolved"
priority = 100

[[events]]
on = "run.requested"
operation = "workflow.run.requested"
priority = 100

[[events]]
on = "run.stage.changed"
operation = "workflow.run.stage.changed"
priority = 100

[[events]]
on = "artifact.created"
operation = "workflow.artifact.created"
priority = 100

[[events]]
on = "job.due"
operation = "workflow.job.due"
priority = 100
