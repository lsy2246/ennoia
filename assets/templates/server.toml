host = "127.0.0.1"
port = 3710

[web_dev]
host = "127.0.0.1"
port = 5173

[cors]
enabled = true
origins = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "http://[::1]:5173",
]
methods = ["GET", "HEAD", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
credentials = true
max_age_seconds = 3600

[timeout]
enabled = true
default_ms = 30000
per_path_ms = {}

[operations.command]
default_timeout_ms = 120000
min_timeout_ms = 1000
max_timeout_ms = 3600000

[operations.net]
default_timeout_ms = 120000
min_timeout_ms = 1000
max_timeout_ms = 3600000

[providers]
default_request_timeout_ms = 300000

[streams]
conversation_poll_ms = 1000
workflow_poll_ms = 1000
logs_poll_ms = 1000

[background]
extension_refresh_ms = 2000
schedule_tick_ms = 1000
event_delivery_tick_ms = 1000

[extension_runtime]
timeout_ms = 30000
memory_limit_mb = 128

[schedules.command]
default_timeout_ms = 120000
min_timeout_ms = 1000
max_timeout_ms = 3600000

[schedules.retry]
default_max_attempts = 1
max_attempts_cap = 10
default_backoff_seconds = 0
max_backoff_seconds = 3600

[dev_supervisor]
host_reload_debounce_ms = 800
watch_poll_ms = 250
api_ready_timeout_ms = 30000
api_healthcheck_interval_ms = 3000
api_healthcheck_grace_ms = 6000
api_port_release_timeout_ms = 20000
child_startup_grace_ms = 1500
probe_socket_timeout_ms = 1500

[logging]
enabled = true
level = "info"
sample_rate = 1.0
redact_headers = ["authorization", "cookie", "x-api-key"]

[logging.dev_console]
enabled = true
level = "error"

# 环境变量可统一覆盖系统日志级别：
# ENNOIA_LOG_LEVEL=debug|info|warn|error

[body_limit]
enabled = true
max_bytes = 1048576
per_path_max = {}

[bootstrap]
is_initialized = false
