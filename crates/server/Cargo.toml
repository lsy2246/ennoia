[package]
name = "ennoia-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ennoia-assets = { path = "../assets" }
ennoia-kernel = { path = "../kernel" }
ennoia-extension-host = { path = "../extension-host" }
ennoia-paths = { path = "../paths" }
ennoia-logs = { path = "../logs" }
ennoia-contract = { path = "../contract" }
ennoia-error-utils = { path = "../error-utils" }
async-stream = "0.3.6"
arc-swap = "1.7.1"
axum = "0.8.9"
chrono = { version = "0.4.42", features = ["serde"] }
futures-core = "0.3.31"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
mime_guess = "2.0.5"
tokio = { version = "1.51.1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "process"] }
toml = "1.1.2"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["v4"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.12.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_System_Threading",
] }

[lib]
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.20.0"
