id = "workflow"
name = "Workflow"
description = "提供 run、task、artifact 与调度动作的编排实现；是否接入 conversation 或 memory 由系统动作管道与事件链决定。"
docs = "docs/overview.md"
kind = "extension"

[source]
mode = "package"
root = "."
dev = false

[ui]
runtime = "browser-esm"
hmr = true

[worker]
kind = "process"
entry = "bin/workflow-service"
protocol = "jsonrpc-stdio"

[build]
ui_bundle = "ui/dist/entry.js"

[assets]
locales_dir = "ui/locales"

[permissions]
storage = "extension"
sqlite = true
events = ["publish", "subscribe"]

[conversation]
inject = true
capabilities = [
  "run.create",
  "run.get",
  "artifact.list",
]

[[surfaces]]
id = "workflow.page"
kind = "page"
title = { key = "ext.workflow.page", fallback = "工作编排" }
route = "/workflow"
mount = "workflow.page"
icon = "workflow"
nav = { default_pinned = false, order = 35 }

[[entrypoints]]
id = "workflow.workspace"
label = { key = "ext.workflow.entry.workspace", fallback = "工作编排工作台" }
description = { key = "ext.workflow.entry.workspace_description", fallback = "查看 run 的阶段流转、判定关卡、任务分支与产物输出。" }
kind = "page"
page_id = "workflow.page"
icon = "workflow"
order = 10
prominent = false

[[locales]]
locale = "zh-CN"
namespace = "ext.workflow"
entry = "ui/locales/zh-CN.json"

[[locales]]
locale = "en-US"
namespace = "ext.workflow"
entry = "ui/locales/en-US.json"

[[capabilities]]
id = "workflow.default"
contract = "behavior.default"
kind = "effect"
entry = "behavior"
metadata = { behavior = { id = "default", extension_id = "workflow", interfaces = ["runs", "tasks", "artifacts", "handoffs", "status"] } }

[[capabilities]]
id = "workflow.workspace"
contract = "workflow.workspace"
kind = "query"
entry = "workspace"
title = { key = "ext.workflow.workspace", fallback = "工作流总览" }
metadata = { action = { key = "workflow.workspace" }, permission = { action = "run.read", target_kind = "run", risk_level = "low", default_decision = "allow", scope_kind = "none" } }

[[capabilities]]
id = "run.create"
contract = "run.create"
kind = "action"
entry = "workflow/runs/create"
metadata = { action = { key = "run.create" }, permission = { action = "run.create", target_kind = "run", risk_level = "medium", default_decision = "allow", scope_kind = "conversation" } }

[[capabilities]]
id = "run.get"
contract = "run.get"
kind = "query"
entry = "workflow/runs/get"
metadata = { action = { key = "run.get" }, permission = { action = "run.read", target_kind = "run", risk_level = "low", default_decision = "allow", scope_kind = "run" } }

[[capabilities]]
id = "run.list"
contract = "run.list"
kind = "query"
entry = "workflow/runs/list-by-conversation"
metadata = { action = { key = "run.list" }, permission = { action = "run.read", target_kind = "run", risk_level = "low", default_decision = "allow", scope_kind = "conversation" } }

[[capabilities]]
id = "task.list"
contract = "task.list"
kind = "query"
entry = "workflow/tasks/list-by-run"
metadata = { action = { key = "task.list" }, permission = { action = "run.read", target_kind = "task", risk_level = "low", default_decision = "allow", scope_kind = "run" } }

[[capabilities]]
id = "artifact.list"
contract = "artifact.list"
kind = "query"
entry = "workflow/artifacts/list-by-run"
metadata = { action = { key = "artifact.list" }, permission = { action = "artifact.read", target_kind = "artifact", risk_level = "low", default_decision = "allow", scope_kind = "run" } }

[[capabilities]]
id = "workflow.run"
contract = "schedule.run"
kind = "action"
entry = "workflow/schedules/run"
title = { key = "ext.workflow.schedule.run", fallback = "Run workflow" }
metadata = { schedule_action = { id = "workflow.run" } }

[[capabilities]]
id = "workflow.conversation.message.created"
contract = "hook.conversation.message.created"
kind = "event_handler"
entry = "hooks/conversation-message-created"

[[capabilities]]
id = "workflow.operation.updated"
contract = "hook.operation.updated"
kind = "event_handler"
entry = "hooks/operation-updated"

[[subscriptions]]
event = "conversation.message.created"
capability = "workflow.conversation.message.created"

[[subscriptions]]
event = "operation.updated"
capability = "workflow.operation.updated"
